<div class="modal-header">
    <h3 translate>Show bind user password</h3>
</div>

<progress-spinner ng:show="password == null"></progress-spinner>

<div style="padding: 0 20px;" ng:show="password != null">
    <br />
    <p><b translate>Loginname:</b> {{username}}</p>
    <input type="text" readonly class="form-control" style="font-family: monospace;"
           ng:model="password" ng:click="$event.target.select()" />
</div>

<div class="modal-footer">
    <a class="btn btn-default btn-flat" ng:show="password != null" ng:click="copy()">
        <i class="fa fa-copy"></i> <span translate>Copy</span>
    </a>
    <a class="btn btn-default btn-flat" ng:click="close()" translate>Close</a>
</div>
